# Application bindings
$terminal = uwsm-app -- kitty
$browser = uwsm-app -- helium-browser

# --- Control Overrides --

### --- Fullscreen ---
unbind = SUPER, F
unbind = SUPER CTRL, F
unbind = SUPER ALT, F

bindd = SUPER ALT, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER CTRL, F, Full screen, fullscreen, 0
bindd = SUPER, F, Full width, fullscreen, 1

# --- VIM based window control ---
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER CTRL, L
unbind = SUPER CTRL, LEFT
unbind = SUPER CTRL, RIGHT

# Ensure movewindow crosses monitor boundaries at tiling edges
binds {
    window_direction_monitor_fallback = true
}

# Focus (SUPER + HJKL / arrows — already in defaults for arrows)
bindd = SUPER, H, Move window focus left, movefocus, l
bindd = SUPER, L, Move window focus right, movefocus, r
bindd = SUPER, K, Move window focus up, movefocus, u
bindd = SUPER, J, Move window focus down, movefocus, d

# Move window (SUPER + CTRL + HJKL / arrows) — crosses monitors at edges
bindd = SUPER CTRL, H, Move window left, movewindow, l
bindd = SUPER CTRL, L, Move window right, movewindow, r
bindd = SUPER CTRL, K, Move window up, movewindow, u
bindd = SUPER CTRL, J, Move window down, movewindow, d
bindd = SUPER CTRL, LEFT, Move window left, movewindow, l
bindd = SUPER CTRL, RIGHT, Move window right, movewindow, r
bindd = SUPER CTRL, UP, Move window up, movewindow, u
bindd = SUPER CTRL, DOWN, Move window down, movewindow, d

# Lock screen (relocated from SUPER+CTRL+L)
bindd = SUPER CTRL, ESCAPE, Lock system, exec, omarchy-lock-screen

# --- Group cycling (override default "Former workspace") ---
unbind = SUPER CTRL, TAB
bindd = SUPER CTRL, TAB, Next window in group, changegroupactive, f
bindd = SUPER CTRL SHIFT, TAB, Previous window in group, changegroupactive, b


# --- System ---
bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
# --- Launchers ---
# Unbind Walker from SUPER+SPACE (Omarchy default) — use rofi launcher instead
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Launch app, exec, pkill rofi || rofi -show combi -combi-modes 'drun,run' -show-icons -no-config -theme launcher-crystal -display-combi ">"

bindd = SUPER, SEMICOLON, Launch app, exec, pkill rofi || rofi -show combi -combi-modes 'drun,run' -show-icons -no-config -theme launcher-crystal -display-combi ">"
bindd = SUPER SHIFT, SEMICOLON, Run command, exec, pkill rofi || rofi -show run -show-icons -no-config -theme launcher-crystal -display-run ">"

# --- Desktop ---
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor

# --- Browser ---
bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --incognito

# --- Communication (workspace: chat) ---
bindd = SUPER SHIFT, W, WhatsApp, exec, hyprctl dispatch workspace name:chat && omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT, S, Slack, exec, hyprctl dispatch workspace name:chat && omarchy-launch-or-focus slack
bindd = SUPER SHIFT, D, Discord, exec, hyprctl dispatch workspace name:chat && omarchy-launch-or-focus-webapp Discord "https://discord.com/app"

# --- Media (workspace: media) ---
bindd = SUPER SHIFT, M, Music, exec, hyprctl dispatch workspace name:media && omarchy-launch-or-focus spotify-launcher
bindd = SUPER SHIFT, Y, YouTube, exec, hyprctl dispatch workspace name:media && omarchy-launch-webapp "https://youtube.com/"

# --- Tools ---
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-or-focus claude-desktop
bindd = SUPER SHIFT, E, Email, exec, hyprctl dispatch workspace name:mail && omarchy-launch-or-focus-webapp Email "https://mail.google.com"
# --- Work ---
bindd = SUPER SHIFT, C, Cursor, exec, uwsm-app -- cursor --disable-gpu --disable-gpu-compositing
bindd = SUPER SHIFT, G, Github, exec, hyprctl dispatch workspace name:dev && omarchy-launch-or-focus-webapp Github "https://github.com"
bindd = SUPER SHIFT, H, Graphite, exec, hyprctl dispatch workspace name:dev && omarchy-launch-or-focus-webapp Graphite "https://app.graphite.dev"

# --- System TUIs ---
bindd = SUPER SHIFT, I, WiFi, exec, omarchy-launch-wifi
bindd = SUPER SHIFT, O, Audio, exec, omarchy-launch-tui wiremix
bindd = SUPER SHIFT, L, Lazyjournal, exec, omarchy-launch-tui lazyjournal
bindd = SUPER SHIFT, P, Bluetooth, exec, omarchy-launch-tui bluetui

# --- Lid Switch ---
# Close lid: disable laptop screen, move everything to external monitor
# Open lid: re-enable laptop screen
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080@144, 7680x0, 1"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment

