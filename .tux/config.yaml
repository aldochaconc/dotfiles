schema_version: 1
tux_version: 2.2.0
workflow_type: greenfield
mode: versioned
agent_tools:
    - claude-code
skill_bundles:
    - skill-bundle/github
    - skill-bundle/mermaid
skill_bundles_explicit: true
permissions:
    default_posture: elevated
skipped_templates: []
post_pr_next_step:
    enabled: true
    tool: claude
    workflow_mode: auto
    workdocs_dir: workdocs
    status:
        greenfield_path: docs/agents/status.md
        brownfield_path_template: '{{workdocs_dir}}/{{workdoc_id}}/status.md'
        open_pr_regex: (?i)\bPR\s*#?\d+\b.*\bopen\b
        close_pr_instruction_template: |-
            Update {{status_path}} by marking the previous "PR open" entry as closed:
            {{open_pr_line}}
    if_none: prompt
    git:
        trunk_branches:
            - main
            - master
            - develop
            - staging
            - prod
            - dev
        delete_remote: true
        remote_name: origin
        pull: true
paths:
    agents_md: AGENTS.md
    docs_agents_dir: docs/agents
    workdocs_dir: workdocs
