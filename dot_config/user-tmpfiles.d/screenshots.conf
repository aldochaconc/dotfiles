# Screenshot retention. omarchy capture screenshot writes to OMARCHY_SCREENSHOT_DIR
# (set in uwsm/env.d/screenshots.conf); this creates that folder and expires what lands there.
#
# `d` creates the directory when it is missing and never removes the directory itself, so the
# folder survives even when empty. The age applies to the files inside it.
# `%h` is the running user's home: tmpfiles.d does not expand `~`.
#
# Cleanup runs from systemd-tmpfiles-clean.timer (user), 15 min after boot and daily after
# that. The timer is enabled by bootstrap.sh; without it nothing expires.
#
# ponytail: no script and no hook, systemd already owns file expiry.
d %h/Pictures/Screenshots 0755 - - 7d
