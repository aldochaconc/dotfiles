# Caches that regenerate on demand, expired by age rather than by name: a directory nobody has
# touched in months costs disk and buys nothing, and the one still in daily use keeps its
# contents because its files stay young. No list of application names to maintain, so a tool
# installed later is covered without editing this file.
#
# `x` would exclude; `e` expires the contents of a directory that already exists and never
# creates or removes the directory itself. A cache directory whose application is gone keeps
# its empty shell, which is harmless.
#
# 90d, not the 7d screenshots use: a compiler or package-manager cache is a build accelerator,
# and evicting one still in weekly use only forces a slow rebuild.
#
# Not listed: ~/.cache/chromium, which the browser evicts itself and rewrites
# constantly; expiring parts of it under a running browser corrupts its index.
#
# Not listed either: ~/.cache/pnpm. Its v11 subdirectory is a content-addressed store, not a
# cache, and every project's node_modules links into it. Its own directory mtime looks recent
# while the entries inside are old, so an age rule would happily delete what live projects
# still point at. `pnpm store prune` is the only safe way to shrink it.
#
# ponytail: no script, no timer of its own. systemd-tmpfiles-clean.timer already runs daily.
e %h/.cache/go-build - - - 90d
e %h/.cache/typescript - - - 90d
e %h/.cache/prisma - - - 90d
e %h/.cache/serverless-python-requirements - - - 90d
