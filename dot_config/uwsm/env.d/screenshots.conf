# omarchy capture screenshot falls back to XDG_PICTURES_DIR, which drops every capture loose in
# ~/Pictures among everything else. Point it at a folder of its own; user-tmpfiles.d/screenshots.conf
# creates that folder and expires its contents after 7 days.
#
# env.d files are shell, sourced into the session: `export` and $HOME both work here, as
# 99-omarchy-upgrade-env already relies on.
export OMARCHY_SCREENSHOT_DIR="$HOME/Pictures/Screenshots"
