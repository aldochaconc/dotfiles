include ~/.config/omarchy/current/theme/kitty.conf

# ── Font ──────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        10.0
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────
cursor_shape          block
cursor_shape_unfocused hollow
cursor_blink_interval 0

# ── Scrollback ────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
scrollback_pager_history_size 4

# ── Mouse ─────────────────────────────────────────────────────────
copy_on_select clipboard
strip_trailing_spaces smart
url_style curly
detect_urls yes
open_url_with default
paste_actions quote-urls-at-prompt,confirm-if-large

# ── Scroll ────────────────────────────────────────────────────────
wheel_scroll_multiplier 2.0
touch_scroll_multiplier 1.0

# ── Window ────────────────────────────────────────────────────────
# top right bottom left (CSS order)
window_padding_width 10 14 10 14
hide_window_decorations yes
confirm_os_window_close 0
resize_in_steps yes
placement_strategy center
background_opacity 0.85

# ── Tab bar ───────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_template      " {index}: {title}{' ({num_windows})' if num_windows > 1 else ''} "

# ── Bell ──────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0

# ── Remote control (socket only) ─────────────────────────────────
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# ── Shell integration ────────────────────────────────────────────
shell_integration enabled

# ── Performance ───────────────────────────────────────────────────
input_delay 1
repaint_delay 6

# ── Keybindings ───────────────────────────────────────────────────

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# Scrolling
map ctrl+shift+k      scroll_line_up
map ctrl+shift+j      scroll_line_down
map ctrl+shift+u      scroll_page_up
map ctrl+shift+d      scroll_page_down
map ctrl+shift+home   scroll_home
map ctrl+shift+end    scroll_end
map ctrl+shift+h      show_scrollback

# Font size
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0

# Windows (splits)
map ctrl+shift+enter  new_window
map ctrl+shift+w      close_window
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window
map ctrl+shift+f      move_window_forward
map ctrl+shift+b      move_window_backward

# Tabs
map ctrl+shift+t      new_tab
map ctrl+shift+q      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+.      move_tab_forward
map ctrl+shift+,      move_tab_backward
map ctrl+shift+alt+t  set_tab_title

# Layouts
map ctrl+shift+l      next_layout
